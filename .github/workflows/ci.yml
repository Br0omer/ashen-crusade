name: Contract tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Character visual contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ARCH-06.1 pose and socket contract
        run: node tests/arch061-contract.cjs
      - name: ARCH-06.2 composite character contract
        run: node tests/arch062-contract.cjs
      - name: Cloud reviewer offline tests
        run: node --test tests/openrouter-review.test.mjs
      - name: Git Operator safety tests
        run: node --test tests/git-flow.test.mjs
      - name: Pipeline V2 role and workflow tests
        run: node --test tests/pipeline-v2.test.mjs
      - name: Browser preview offline tests
        run: node --test tests/browser-preview-smoke.test.mjs


  browser-preview:
    name: Browser preview smoke
    if: github.event_name == 'pull_request'
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge commit (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed browser prototypes
        id: detect
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" | grep -Eq '^prototypes/[a-z0-9-]+/'; then
            echo "preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "preview=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.detect.outputs.preview == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runner (no secrets)
        if: steps.detect.outputs.preview == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real browser launch at immutable HTTPS SHA
        if: steps.detect.outputs.preview == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tests/browser-preview-smoke.mjs
