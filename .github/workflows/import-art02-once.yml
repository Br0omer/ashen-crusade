name: Import prepared ART-02 build (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-art02-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import only the authorized build files after SHA-256 verification
        env:
          BUILD_ARCHIVE_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-0bb4-8243-9f89-7b52f74408e6/raw?se=2026-11-10T21%3A52%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=fcc66dfa-9548-5fff-b69e-9b9a132e81ca&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T03%3A12%3A54Z&ske=2026-11-11T03%3A12%3A54Z&sks=b&skv=2026-02-06&sig=NUXNYwthJI2qG7aOO%2BYqF30WsTGPsu8dPfUQpTQA9Lk%3D'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, urllib.request, zipfile
          url = os.environ['BUILD_ARCHIVE_URL']
          print('::add-mask::' + url)
          with urllib.request.urlopen(url, timeout=90) as response:
              payload = response.read(2_000_001)
          expected = 'f57e3563e2884ae7b43b28956382aceff9f45796b9dbe49358324a0a8a5d742f'
          assert hashlib.sha256(payload).hexdigest() == expected, 'Build archive checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(payload))
          fixed = {'ashen-crusade-art02-walk.html', 'docs/art02-frames.md', 'tests/art02-frames-local.json'}
          contents = {}
          for entry in archive.infolist():
              name = pathlib.PurePosixPath(entry.filename)
              assert not name.is_absolute() and '..' not in name.parts
              assert entry.filename in fixed or (name.parts[0] == 'art02-frames' and entry.filename.endswith(('.html', '.js', '.json', '.css', '.svg', '.webp'))), entry.filename
              assert not entry.is_dir() and entry.file_size < 1_000_000
              assert not pathlib.Path(entry.filename).exists(), 'Do not overwrite an existing build: ' + entry.filename
              contents[entry.filename] = archive.read(entry)
          assert len(contents) == 20, 'Unexpected file count'
          for name, data in contents.items():
              path = pathlib.Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          for script in pathlib.Path('art02-frames/js').glob('*.js'):
              subprocess.run(['node', '--check', str(script)], check=True)
          report = {'archiveSHA256': expected, 'files': {name: hashlib.sha256(data).hexdigest() for name, data in contents.items()}, 'status': 'imported byte-for-byte; awaiting Pages deployment and tablet acceptance'}
          pathlib.Path('art02-frames/import-checksums.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Verified and imported', len(contents), 'files without modifying accepted builds.')
          PY
      - name: Commit only the imported files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- art02-frames ashen-crusade-art02-walk.html docs/art02-frames.md tests/art02-frames-local.json
          git commit -m 'ART-02a.3: publish approved eight-frame walk candidate without texture deformation'
          git push origin HEAD:main
