let running=false,paused=false,t=0,last=0,spawn=0,shots=[],enemies=[],particles=[],drops=[],score=0,kills=0,boss=false,level=1,exp=0,needed=8;const p={x:0,y:0,hp:100,max:100,ammo:0,angle:0,fire:0,melee:0,dash:0,ability:0,heal:3,inv:0,speed:215};let prev={};function reset(){t=0;spawn=0;shots=[];enemies=[];particles=[];drops=[];score=0;kills=0;boss=false;level=1;exp=0;needed=8;Object.assign(p,{x:0,y:0,hp:100,max:100,fire:0,melee:0,dash:0,ability:0,heal:3,inv:0,speed:215});running=true;paused=false;document.getElementById('start').style.display='none'}document.getElementById('play').onclick=reset;
function rand(a,b){return a+Math.random()*(b-a)}function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}function burst(px,py,col,n=9){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:rand(-130,130),vy:rand(-130,130),life:rand(.2,.65),col})}function enemy(type){let a=rand(0,Math.PI*2),r=Math.max(W,H)*.72+150;let cfg=type==='boss'?[320,50,20,'#aa4770']:type==='brute'?[100,42,20,'#aa694c']:[45,rand(55,85),12,'#8e9b83'];enemies.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,hp:cfg[0],max:cfg[0],speed:cfg[1],r:cfg[2],col:cfg[3],type,attack:0})}function damage(e,n){e.hp-=n;burst(e.x,e.y,e.col,3);if(e.hp<=0){burst(e.x,e.y,'#d6a962',15);score+=e.type==='boss'?1000:100;kills++;exp+=e.type==='boss'?20:1;if(Math.random()<.16)drops.push({x:e.x,y:e.y,type:'heal'});if(e.type==='boss')boss=false;while(exp>=needed){exp-=needed;level++;needed=Math.ceil(needed*1.3);p.max+=12;p.hp=Math.min(p.max,p.hp+30);p.speed+=3}}}function input(){let g=[...navigator.getGamepads?.()||[]].find(Boolean),axes=g?.axes||[],buttons=g?.buttons||[];const b=i=>!!buttons[i]?.pressed,edge=i=>b(i)&&!prev[i];let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+(Math.abs(axes[0]||0)>.18?axes[0]:0),dy=(keys.KeyS?1:0)-(keys.KeyW?1:0)+(Math.abs(axes[1]||0)>.18?axes[1]:0);let aimx=axes[2]||0,aimy=axes[3]||0;if(Math.hypot(aimx,aimy)>.25)p.angle=Math.atan2(aimy,aimx);else if(mouse.x||mouse.y)p.angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);const result={dx,dy,shoot:mouse.down||b(7)||keys.KeyJ,melee:edge(2)||keys.KeyE&&!prev.e,dash:edge(1)||keys.Space&&!prev.space,ability:edge(3)||keys.KeyQ&&!prev.q,heal:edge(4)||keys.KeyH&&!prev.h,pause:edge(9)||keys.Escape&&!prev.esc};for(let i=0;i<buttons.length;i++)prev[i]=b(i);prev.e=!!keys.KeyE;prev.space=!!keys.Space;prev.q=!!keys.KeyQ;prev.h=!!keys.KeyH;prev.esc=!!keys.Escape;return result}
function update(dt){let k=input();if(k.pause)paused=!paused;if(paused)return;t+=dt;for(let q of ['fire','melee','dash','ability','inv'])p[q]=Math.max(0,p[q]-dt);let mag=Math.hypot(k.dx,k.dy)||1,speed=p.speed*(p.dash>.65?2.6:1);p.x+=k.dx/mag*speed*dt;p.y+=k.dy/mag*speed*dt;if(k.dash&&p.dash<=0){p.dash=.83;p.inv=.35;burst(p.x,p.y,'#7cb9e5',12)}if(k.shoot&&p.fire<=0){p.fire=.17;shots.push({x:p.x+Math.cos(p.angle)*23,y:p.y+Math.sin(p.angle)*23,vx:Math.cos(p.angle)*780,vy:Math.sin(p.angle)*780,life:.8});burst(p.x+Math.cos(p.angle)*22,p.y+Math.sin(p.angle)*22,'#f9b65e',3)}if(k.melee&&p.melee<=0){p.melee=.65;for(let e of enemies)if(hit(p,e,100)&&Math.cos(Math.atan2(e.y-p.y,e.x-p.x)-p.angle)>.15)damage(e,60+level*3);burst(p.x+Math.cos(p.angle)*50,p.y+Math.sin(p.angle)*50,'#a6d8e9',15)}if(k.ability&&p.ability<=0){p.ability=9;for(let e of enemies)if(hit(p,e,240))damage(e,85+level*5);burst(p.x,p.y,'#c6a2ff',50)}if(k.heal&&p.heal>0&&p.hp<p.max){p.heal--;p.hp=Math.min(p.max,p.hp+55);burst(p.x,p.y,'#6bdd9e',18)}spawn-=dt;if(spawn<=0&&enemies.length<85){enemy(Math.random()<Math.min(.28,t/200)?'brute':'grunt');spawn=Math.max(.23,1.3-t*.004)}if(t>100&&!boss){enemy('boss');boss=true}for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let e of enemies)if(e.hp>0&&hit(s,e,e.r+5)){damage(e,27+level*2);s.life=0;break}}shots=shots.filter(s=>s.life>0);for(let e of enemies){if(e.hp<=0)continue;let d=Math.hypot(p.x-e.x,p.y-e.y)||1;e.x+=(p.x-e.x)/d*e.speed*dt;e.y+=(p.y-e.y)/d*e.speed*dt;e.attack-=dt;if(d<e.r+19&&e.attack<=0&&p.inv<=0){p.hp-=e.type==='boss'?22:e.type==='brute'?15:7;p.inv=.4;e.attack=.75;burst(p.x,p.y,'#e35d62',12)}}enemies=enemies.filter(e=>e.hp>0);for(let d of drops)if(hit(d,p,30)){p.hp=Math.min(p.max,p.hp+20);d.used=true;burst(d.x,d.y,'#6bdd9e')}drops=drops.filter(d=>!d.used);for(let a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt}particles=particles.filter(a=>a.life>0);if(p.hp<=0){running=false;document.getElementById('start').style.display='grid';document.quer function poly(cx,cy,r,n,rot=0){x.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n;x[i?'lineTo':'moveTo'](cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath()}function render(){x.fillStyle='#0b0e17';x.fillRect(0,0,W,H);let ox=W/2-p.x,oy=H/2-p.y;x.save();x.translate(ox,oy);let minx=p.x-W/2-80,maxx=p.x+W/2+80,miny=p.y-H/2-80,maxy=p.y+H/2+80;for(let i=Math.floor(minx/90);i*90<maxx;i++)for(let j=Math.floor(miny/90);j*90<maxy;j++){x.strokeStyle=(i+j)%5===0?'#30303a':'#1c2430';x.lineWidth=1;x.strokeRect(i*90,j*90,90,90);if((i*17+j*13)%19===0){x.fillStyle='#393026';x.fillRect(i*90+30,j*90+30,25,8)}}for(let d of drops){x.fillStyle='#5ddda2';x.beginPath();x.arc(d.x,d.y,9,0,7);x.fill()}for(let s of shots){x.fillStyle='#ffcb6c';x.beginPath();x.arc(s.x,s.y,4,0,7);x.fill()}for(let e of enemies){x.fillStyle='#0009';x.beginPath();x.ellipse(e.x,e.y+8,e.r*1.1,e.r*.45,0,0,7);x.fill();poly(e.x,e.y,e.r,e.type==='boss'?8:6,t*.3);x.fillStyle=e.col;x.fill();x.strokeStyle='#d5b68a';x.lineWidth=2;x.stroke();x.fillStyle='#271b20';x.fillRect(e.x-e.r,e.y-e.r-13,e.r*2,4);x.fillStyle='#e56b6c';x.fillRect(e.x-e.r,e.y-e.r-13,e.r*2*Math.max(0,e.hp/e.max),4)}x.save();x.translate(p.x,p.y);x.rotate(p.angle);x.fillStyle=p.inv>0?'#8cdbff':'#c1b99b';poly(0,0,19,6,Math.PI/6);x.fill();x.strokeStyle='#5d8295';x.lineWidth=5;x.stroke();x.fillStyle='#d7a75b';x.fillRect(9,-5,24,10);x.fillStyle='#473a34';x.fillRect(-12,-8,13,16);x.restore();for(let a of particles){x.globalAlpha=Math.min(1,a.life*2);x.fillStyle=a.col;x.fillRect(a.x-2,a.y-2,4,4)}x.globalAlpha=1;x.restore();x.fillStyle='#080b12c9';x.fillRect(12,12,270,98);x.fillStyle='#e4c68e';x.font='bold 16px system-ui';x.fillText('ПЕПЕЛЬНЫЙ КРЕСТОВЫЙ ПОХОД',22,34);x.fillStyle='#42232c';x.fillRect(22,46,240,15);x.fillStyle='#c95365';x.fillRect(22,46,240*Math.max(0,p.hp/p.max),15);x.fillStyle='#f4e7d3';x.font='12px system-ui';x.fillText(`HP ${Math.max(0,Math.ceil(p.hp))}/${p.max} · Уровень ${level} · Лечение ${p.heal}`,22,77);x.fillText(`Время ${Math.floor(t)}с · Убийств ${kills} · Счёт ${score}`,22,95);x.textAlign='right';x.fillStyle='#d9b784';x.fillText(`Импульс ${p.ability>0?p.ability.toFixed(1)+'с':'ГОТОВ'} · ${boss?'БОСС НА АРЕНЕ':t<100?'Босс через '+Math.ceil(100-t)+'с':'Зачистка'}`,W-20,28);x.textAlign='left';if(paused){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='#f0d4a3';x.textAlign='center';x.font='bold 40px system-ui';x.fillText('ПАУЗА',W/2,H/2);x.textAlign='left'}}function loop(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;if(running)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
